name: DeskOrb Agent quality gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-quality:
    name: Local tests and repeatable E2E
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and component tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Run repeatable E2E matrix
        run: python tests/matrix_e2e_runner.py --repetitions 3 --output artifacts/e2e-report.json

      - name: Enforce privacy-safe quality gate
        run: >-
          python tests/run_quality_gate.py
          --report artifacts/e2e-report.json
          --require-full-matrix
          --repetitions 3

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check whitespace
        shell: bash
        run: git diff --check

      - name: Upload normalized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deskorb-e2e-report
          path: artifacts/e2e-report.json
          if-no-files-found: ignore
